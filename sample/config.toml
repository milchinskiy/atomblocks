# example configuration file
#
# Each block has several parameters:
# `execute`      - shell command or script executed through `sh -c`.
# `interval`     - optional interval in seconds. Positive values run once at
#                  startup and then periodically. Zero or omission is manual-only.
# `timeout`      - optional maximum runtime in seconds. Omit for no timeout.
# `output_limit` - optional stdout capture limit in bytes (default: 65536).
#
# Manual-only blocks are refreshed with `atomblocks hit <ID>`.
# Repeated hits while a block is already running are coalesced into one follow-up
# execution. Periodic ticks missed while a block is busy are skipped, not replayed.

# (optional) delimiter between non-empty blocks in the bar
delimiter = " | "

[[block]]
# executed as /bin/sh -c <your command>
execute = "date +%s"
# positive intervals run immediately and then on this cadence
interval = 1
# optional timeout; long-running commands may leave this unset
timeout = 5
# optional stdout capture bound; omitted here to use 64 KiB
# output_limit = 65536
# optional text around command stdout
before = "date: "
after = ""

[[block]]
execute = "echo 'Hello, World!'"
interval = 600

[[block]]
execute = "xkblayout-state print '%s'"
# zero and omission both mean manual-only
interval = 0
# update with: atomblocks hit 2
